name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Tests run against a real Postgres (same major version as dev and Supabase).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vehicle_access
          POSTGRES_PASSWORD: vehicle_access
          POSTGRES_DB: vehicle_access
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vehicle_access" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vehicle_access:vehicle_access@127.0.0.1:5432/vehicle_access_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: client/openapi.json matches the server's API (run `npm run openapi` if this fails)
        run: |
          DATABASE_URL=$TEST_DATABASE_URL npm run openapi
          git diff --exit-code ../client/openapi.json

  client:
    name: client (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Generated API types match openapi.json (run `npm run api:types` if this fails)
        run: |
          npm run api:types
          git diff --exit-code src/lib/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  anpr:
    name: anpr (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anpr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # The worker without the (large) OCR extra; tests use a stand-in OCR.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # The real detector (10 MB, pinned + SHA-256 checked), cached between runs.
      - uses: actions/cache@v6
        with:
          path: anpr/models
          key: plate-detector-f8fb9d5-v1n
      - run: python -m anpr.download_model
      - run: pytest

  compose:
    name: docker compose smoke test + end-to-end journeys
    runs-on: ubuntu-latest
    # Short time limits so the overstay journey (limit → overstay → call task) takes minutes.
    env:
      VISIT_LIMIT_CAB_MINUTES: "1"
      OVERSTAY_REMINDER_MINUTES: "1"
      OVERSTAY_ESCALATION_MINUTES: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Start the dev stack and wait for health checks
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: API answers directly and through the Vite proxy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:4000/api/health
          curl --fail --silent --show-error http://127.0.0.1:4000/api/ready
          curl --fail --silent --show-error http://127.0.0.1:4000/api/openapi.json > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:5173/api/health
          curl --fail --silent --show-error http://127.0.0.1:5173/ | grep -q '<div id="root">'
          curl --fail --silent --show-error http://127.0.0.1:8025/ > /dev/null
      - name: Seed the database and sign in as each demo role
        run: |
          docker compose exec -T server npm run seed -- --reset > /dev/null
          for who in admin guard resident; do
            curl --fail --silent --show-error -X POST http://127.0.0.1:4000/api/auth/login \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$who@example.com\",\"password\":\"demo-password-change-me\"}" > /dev/null
            echo "signed in as $who"
          done
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install Playwright
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end journeys (resident car, visitor approval, overstay escalation)
        working-directory: client
        run: npm run e2e
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Runs the official gitleaks image directly (the gitleaks GitHub Action needs a licence key for orgs).
      - name: Scan the full git history
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --verbose
