[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "anpr"
version = "0.0.0"
description = "Edge ANPR worker: finds number plates, reads them, votes across frames, posts one read per car"
license = "MIT"
requires-python = ">=3.12"
# Runtime dependencies (onnxruntime, opencv-python-headless, numpy, paddleocr, httpx,
# pydantic-settings) are added in Phase 3 when the code that uses them lands.
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.6", "pytest==9.2.0"]

[tool.setuptools]
packages = ["anpr"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
