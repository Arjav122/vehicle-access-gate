# Dev stack: Postgres, Mailpit, Node API, Vite client. Start with `docker compose up --build`.
# Every port is bound to 127.0.0.1, so nothing is reachable from other machines on your network.
# The ANPR worker is not here: it runs at the edge (your laptop), see anpr/.

name: vehicle-access

services:
  postgres:
    # Same major version as the hosted Supabase database (see docs/decisions.md).
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vehicle_access
      POSTGRES_PASSWORD: vehicle_access
      POSTGRES_DB: vehicle_access
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle_access -d vehicle_access"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches every outgoing email in dev. Web inbox: http://127.0.0.1:8025
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  server:
    build: ./server
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database and mail hosts are the service names.
      DATABASE_URL: postgresql://vehicle_access:vehicle_access@postgres:5432/vehicle_access
      DIRECT_URL: postgresql://vehicle_access:vehicle_access@postgres:5432/vehicle_access
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      HOST: 0.0.0.0
      PORT: "4000"
      # Dev-only default so `docker compose exec server npm run seed` works out of the box.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password-change-me}
      # File-change events do not cross a Windows -> Docker bind mount; let tsx watch poll.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # Live-edit the source; node_modules stays the one built inside the image.
      - ./server/src:/app/src:ro
      # Camera snapshots survive container rebuilds.
      - snapshots:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  client:
    build: ./client
    environment:
      VITE_DEV_API_TARGET: http://server:4000
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./client/src:/app/src:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  snapshots:
